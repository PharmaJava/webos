# Stremio Origin for Android TV: builds the APK (armeabi-v7a, every Android TV / Google TV) and opens an x86_64 build of the
# same code on an emulator (tools/android-smoke.sh: it must draw frames, reach the network and not crash).
# On main, or by hand, the APK goes on the release "android-tv-v<version>".
name: Android TV

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: '27.2.12479018'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null
      - name: Build the APK
        run: GRADLE=gradle tools/build-android.sh
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: dist/*.apk }

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null
      - name: Build for the emulator (x86_64)
        run: |
          tools/android-deps.sh
          (cd androidtv && gradle --no-daemon -q -PoriginAbis=x86_64 :app:assembleDebug)
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: tools/android-smoke.sh androidtv/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke, path: dist/smoke/ }

  release:
    needs: [build, emulator]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk, path: dist }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(python3 -c 'import json; print(json.load(open("pkg/appinfo.json"))["version"])')
          tag="android-tv-v$ver"
          (cd dist && sha256sum *.apk > SHA256SUMS)
          if gh release view "$tag" >/dev/null 2>&1; then gh release upload "$tag" dist/*.apk dist/SHA256SUMS --clobber
          else gh release create "$tag" dist/*.apk dist/SHA256SUMS --title "Stremio Origin $ver for Android TV" \
            --notes "Stremio Origin for Android TV and Google TV (Sony Bravia, TCL, Philips, Chromecast with Google TV…). Install the APK on the TV (Downloader, a USB drive or adb install)."; fi
