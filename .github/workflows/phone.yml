# Stremio Claude for Android phones and tablets (the phone branch): both processors' APKs, the torrent and download engines inside,
# signed with the release key (the ORIGIN_KEYSTORE secret, the same as the Android TV build). Pushed to the phone branch (or by hand),
# a version not yet published goes out as "phone-v<version>" (never the repository's Latest: that is the LG package).
name: Android phone
on:
  push:
    branches: [phone]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - name: NDK, cmake, ninja
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
          sudo apt-get install -y -qq ninja-build > /dev/null
      - name: The signing key
        env:
          KEYSTORE: ${{ secrets.ORIGIN_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/origin.keystore"; echo "PHONE_KEYSTORE=$RUNNER_TEMP/origin.keystore" >> "$GITHUB_ENV"
          else echo "No ORIGIN_KEYSTORE secret: debug key (not published)" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - name: Build the APKs
        env:
          PHONE_KEYSTORE_PASSWORD: ${{ secrets.ORIGIN_KEYSTORE_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}       # (the app's own key, built in scrambled: platforms, For you, premieres; without it each person adds theirs)
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: GRADLE=gradle tools/phone/ci.sh
      - id: signed
        run: echo "signed=${PHONE_KEYSTORE:+1}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: phone-apk, path: dist/*.apk }
    outputs:
      signed: ${{ steps.signed.outputs.signed }}

  emulator:
    # the APKs opened on an emulator: the arm64 one a phone installs (run through the emulator's ARM translation) and the x86_64 one
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: phone-apk, path: dist }
      - name: Stremio Origin's own phone APK, to compare with (the same emulator, the same ARM translation)
        run: curl -fsSL -o "$RUNNER_TEMP/upstream-arm64.apk" https://github.com/stremio-origin/android-phone/releases/download/v1.1.0/stremio-origin-phone-1.1.0-arm64-v8a.apk || true
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: tools/phone/smoke.sh dist/*-x86_64.apk x86_64; r1=$?; tools/phone/smoke.sh dist/*-arm64-v8a.apk arm64; [ $r2 = 0 ] || echo "::warning::arm64 through the emulator ARM translation did not run (Stremio Origin own APK neither, so the translator, not the app)"; [ -f "$RUNNER_TEMP/upstream-arm64.apk" ] && PKG=app.stremioorigin.phone tools/phone/smoke.sh "$RUNNER_TEMP/upstream-arm64.apk" upstream-arm64; exit $r1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: phone-smoke, path: dist/smoke-*/ }

  release:
    needs: [build, emulator]
    if: needs.build.outputs.signed == '1' && github.event_name == 'workflow_dispatch'   # (published by hand, once a build is tried)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: phone-apk, path: dist }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android-phone/app/build.gradle | head -1)
          tag="phone-v$ver"
          (cd dist && sha256sum *.apk > SHA256SUMS)
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag is already published: left as it is" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          gh release create "$tag" dist/*.apk dist/SHA256SUMS --latest=false --target phone --title "Stremio Claude $ver for Android phones and tablets" \
            --notes "Stremio Claude for Android phones and tablets: your Stremio account and addons, torrents and downloads. Take the arm64-v8a file (nearly every phone since 2017; armeabi-v7a only for very old ones), open it and allow installs from this source when Android asks. No Stremio account yet? Create it inside the app. It installs beside the official app and updates itself from here."
